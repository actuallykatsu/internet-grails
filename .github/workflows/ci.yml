name: CI

on:
  # Every branch, so work on a feature branch is checked before it reaches main (D31).
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Repair drop files the way "Sync drops" will (D27), so a phone slip it can fix
      # doesn't fail CI; a file it can't fix fails here.
      - run: node scripts/sync-drops.mjs --repair
      # Build the real site first: this checks every real drop file (D25).
      - run: npm run build
      # Then rebuild for the tests, with the fixed sample drops and a fake forms endpoint
      # so the contact form test exercises the send path (D21).
      - run: npm run build
        env:
          DROPS_DIR: tests/fixtures/drops
          PUBLIC_CONTACT_ENDPOINT: https://forms.example.test/contact
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
